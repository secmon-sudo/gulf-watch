name: probe-longhaul

# ONE-OFF DIAGNOSTIC -- delete once it has answered.
#
# Question: are the intercontinental carriers missing from `flight` because
# OpenSky finalises long-haul arrival/departure estimates later than the 48h
# window ingest reads, or for some other reason? Thirteen carriers that ran
# ~30 departures a day in the Nov-Jan baseline window (AFR 28.3/wk at Dubai,
# DLH 20.4, KLM 11.3, BAW, AAL, IBE, JAL, CSN...) total 0-1 a day across all
# of August 2026, while every carrier still visible is Gulf/Levant/Turkey
# based.
#
# Method: re-ask OpenSky for a day we already ingested at the time -- 2026-08-19,
# fully inside the 2026-08-20T14:14Z run's 48h window -- and compare, record by
# record, what it returns now against what we stored then. Anything present now
# and absent from `flight` arrived after we asked.
#
# Costs exactly two OpenSky requests (one UTC day is one partition), and writes
# nothing.

on:
  workflow_dispatch:
    inputs:
      day:
        description: "UTC day to re-ask for (YYYY-MM-DD)"
        default: "2026-08-19"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          DAY: ${{ inputs.day || '2026-08-19' }}
        run: |
          python - <<'PY'
          import os, sqlite3, collections, datetime as dt
          from src import config
          from src.opensky import OpenSky, API
          from src.parse import normalise, parse_callsign

          day = os.environ["DAY"]
          begin = int(dt.datetime.strptime(day, "%Y-%m-%d")
                      .replace(tzinfo=dt.timezone.utc).timestamp())
          end = begin + 24 * 3600

          api = OpenSky()
          print("authenticated:", api.authenticated)
          carriers = config.carriers()
          conn = sqlite3.connect("data/gulfwatch.db")
          held = {(i, f) for i, f in conn.execute(
              "SELECT icao24, first_seen FROM flight")}

          # The set that vanished from August, named here so the output reads
          # without a lookup. Everything else returned is regional.
          FOREIGN = {"BAW","AFR","DLH","KLM","AAL","JAL","IBE","FIN",
                     "CSN","CCA","CES","DAH","IBS"}

          # The request goes out through the client's session and auth header
          # rather than _get(), only so the response headers survive: the
          # allowance left is the one number a run cannot estimate.
          def ask(icao):
              resp = api.session.get(
                  f"{API}/flights/arrival",
                  params={"airport": icao, "begin": begin, "end": end},
                  headers=api._auth_header(), timeout=60)
              print(f"{icao}: HTTP {resp.status_code}  remaining="
                    f"{resp.headers.get('X-Rate-Limit-Remaining')}")
              if resp.status_code == 404:
                  return []
              resp.raise_for_status()
              return resp.json()

          for icao in ("OMDB",):
              raw = ask(icao)
              print(f"=== {icao} arrivals {day}: {len(raw)} records now ===")

              # Round two. Round one showed the thirteen absent from the feed
              # entirely and `missed` at zero for every carrier, so nothing is
              # arriving late -- the question left is whether they are really
              # absent or merely wearing a callsign parse_callsign rejects.
              # Asking by origin airport rather than by callsign is the way to
              # find out: an EGLL/LFPG/EDDF/EHAM departure is a BA/AF/LH/KLM
              # leg whatever it calls itself.
              EURO = ("EG", "LF", "ED", "EH", "LE", "EF", "LI", "LS", "EK",
                      "EB", "LO", "LK", "EP", "ES", "EN", "LG", "LP", "LT")
              euro = [r for r in raw
                      if (r.get("estDepartureAirport") or "").startswith(EURO)]
              print(f"\n-- records whose estimated origin is European: {len(euro)}")
              for r in sorted(euro, key=lambda r: r.get("estDepartureAirport") or ""):
                  print(f"   {r.get('estDepartureAirport')}  "
                        f"callsign={r.get('callsign')!r}  icao24={r.get('icao24')}")

              unparsed = [r for r in raw if parse_callsign(r.get("callsign"))[0] is None]
              print(f"\n-- records whose callsign does not parse: {len(unparsed)}")
              for r in unparsed:
                  print(f"   callsign={r.get('callsign')!r}  "
                        f"dep={r.get('estDepartureAirport')}  icao24={r.get('icao24')}")

              origins = collections.Counter(
                  (r.get("estDepartureAirport") or "(none)")[:2] for r in raw)
              print("\n-- origins by ICAO region prefix:",
                    dict(sorted(origins.items(), key=lambda kv: -kv[1])))
          PY
