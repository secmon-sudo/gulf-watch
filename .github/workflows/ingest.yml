name: ingest

# Pull the last 48h from OpenSky, rebuild the rollups, score coverage, run
# stop/resume detection, regenerate the static JSON, commit both the SQLite
# file and public/, then redeploy Pages.
#
# Daily at 12:00 UTC, plus manual dispatch. It was manual-only until
# 2026-08-23, when the cost of that showed up in the output: nothing ran for
# three days, the trailing 7-day window slid past the observed days, and every
# published ratio -- Gulf Air at 1.02 included -- vanished until a run
# recovered it. The analysis needs 5 observed days inside a rolling 7
# (config.MIN_OBSERVED_DAYS), so a missed day is not a missed reading, it is a
# gap that keeps costing for a week.
#
# 12:00 UTC. The "allowance resets at a fixed ~10:44" reading this note used to
# give was WRONG, measured 2026-09-02: at 13:21, with nothing having run that
# day, OpenSky still answered `retry in 4.5h`. The reset is a rolling window
# from whenever the quota was spent, not a wall clock -- so the hour in this
# cron does not buy a full allowance, it only decides what time of day this run
# will set the reset to for tomorrow. That is self-stabilising while this
# workflow is the only consumer, and it broke the moment the baseline harvest
# became a second one (see backfill-baseline.yml).
#
# Daily and not hourly. Analysis is anchored on the last settled UTC day
# (config.SETTLE_LAG_DAYS), so extra runs recompute the same answer, and
# measured against a real account ~85 requests exhaust the daily allowance
# while one all-airports pass costs ~52.

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Lookback window in hours"
        default: "48"
      all_airports:
        description: "Poll every airport, not just priority 1"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# Two runs writing the same SQLite file and pushing the same branch will
# collide. Queue them instead; a skipped run just means a wider lookback next
# time, which the 48h re-read already handles.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ingest
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          FAA_CLIENT_ID: ${{ secrets.FAA_CLIENT_ID }}
          FAA_CLIENT_SECRET: ${{ secrets.FAA_CLIENT_SECRET }}
          # Now actually read: ingest calls schedules.refresh(), which is the
          # only thing that keeps the timetable for the ADS-B-blind airports
          # from freezing. Without the key it logs a warning and skips.
          AIRLABS_API_KEY: ${{ secrets.AIRLABS_API_KEY }}
        run: |
          # A scheduled event carries no inputs -- GitHub does not apply
          # workflow_dispatch defaults to it -- so both flags fall back
          # explicitly. --all-airports especially: without it a scheduled run
          # would drop to pick_airports()'s priority filter, which polls
          # everything only when the hour divides by 4. That would work at
          # 12:00 by coincidence and break the moment the cron moved.
          python -m src.ingest \
            --hours "${{ inputs.hours || '48' }}" \
            ${{ (inputs.all_airports || github.event_name == 'schedule') && '--all-airports' || '' }}

      - name: Publish JSON
        run: python -m src.publish

      - name: Report
        # public/report.html is committed and served by Pages, so it has to be
        # regenerated here or the site shows a fresh JSON API beside a stale
        # report. Runs before the WAL checkpoint because report.py writes back
        # to the db -- it caches headline classifications.
        #
        # Without MISTRAL_API_KEY, classify.available() is false and headline
        # reading falls back to keyword matching; the run still completes.
        #
        # AIRLABS_API_KEY is deliberately not passed. report.py only reads the
        # cached route_schedule table; the one function that calls the AirLabs
        # API is schedules.refresh(), and that runs in the Ingest step above
        # (src/ingest.py), which is where the key is passed. The key would do
        # nothing here.
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python -m src.report

      - name: Checkpoint WAL
        # The db is committed to the repo; the -wal sidecar is not. Fold it in
        # so the committed file is complete on its own.
        run: |
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect("data/gulfwatch.db")
          c.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          c.close()
          PY

      - name: Commit
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gulfwatch.db public
          if git diff --cached --quiet; then
            echo "nothing changed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "ingest: $(date -u +%Y-%m-%dT%H:%MZ)"
          # Another run may have landed while we were fetching.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: ingest
    if: needs.ingest.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
