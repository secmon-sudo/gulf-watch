name: backfill-baseline

# One-time harvest of the frozen pre-escalation reference period. Nothing in
# this project means anything without it: "12 flights a week" is not
# information, "12 against a baseline of 21" is.
#
# It runs for hours and burns most of a day's OpenSky credits. Dispatch it by
# hand. The 104-slice harvest of 2025-11-01..2026-01-31 completed on
# 2026-08-11 and the baseline is frozen, so a run now has nothing to fetch --
# what remains is re-harvesting a different window on purpose.

# The 2026-08-25 re-harvest ran on a TEMPORARY `schedule:` block here. It is
# gone, and it must not come back on the reasoning it carried, because that
# reasoning rested on a premise measured false on 2026-09-02: the OpenSky
# allowance does NOT reset at a fixed ~10:44. The reset is a rolling window
# from whenever the quota was spent, so the daily 15:00 harvest -- delivered by
# GitHub nearer 18:00 -- moved the next reset to ~18:00 and every ingest that
# landed before it got zero legs. Three of five ingests died that way
# (08-29, 08-30, 09-01) and `observed_days` fell to 2 of the required 5.
# Queueing second does not protect the ingest when the harvest sets the clock
# the ingest is read against.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Baseline window start (YYYY-MM-DD)"
        default: "2025-11-01"
      end:
        description: "Baseline window end (YYYY-MM-DD)"
        default: "2026-01-31"
      freeze_only:
        description: "Skip the harvest, just recompute from legs already ingested"
        type: boolean
        default: false
      airports:
        description: "ICAO list to harvest. Leave blank for the set OpenSky can
          actually see -- the seven it omits returned zero flights each over a
          real 48h ingest and cost about half the daily allowance to learn it.
          'all' forces every airport in config."
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

# Must never run alongside an ingest -- both write the same SQLite file.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # GitHub caps a job at 6 hours. The harvest paces itself with 2s sleeps
    # across ~340 requests plus OpenSky's own backoff.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Backfill
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        # Exit 2 is "allowance exhausted, resume tomorrow" -- the expected
        # outcome on every run but the last, and the slices that did land must
        # still be published and committed. Letting the step fail there aborted
        # the job before the Commit step and threw the day's harvest away.
        # Any other non-zero code is a real failure and still stops the job.
        #
        # The flags are built rather than interpolated straight in: a schedule
        # event carries no inputs at all -- GitHub does not apply the
        # workflow_dispatch defaults to it -- so `--start ""` is what a cron
        # run would have passed. Omitting the flag instead lets argparse fall
        # back to config.BASELINE_START/END, which hold the same dates.
        run: |
          rc=0
          args=()
          if [ -n "${{ inputs.start }}" ];    then args+=(--start "${{ inputs.start }}"); fi
          if [ -n "${{ inputs.end }}" ];      then args+=(--end "${{ inputs.end }}"); fi
          if [ -n "${{ inputs.airports }}" ]; then args+=(--airports "${{ inputs.airports }}"); fi
          if [ "${{ inputs.freeze_only }}" = "true" ]; then args+=(--freeze-only); fi
          echo "backfill args: ${args[*]:-<config defaults>}"
          python -m src.backfill "${args[@]}" || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::backfill failed with exit $rc"
            exit "$rc"
          fi
          [ "$rc" -eq 2 ] && echo "::notice::allowance exhausted; committing what landed and resuming next run"
          exit 0

      - name: Publish JSON
        run: python -m src.publish

      - name: Report
        # Same reason as ingest.yml: public/report.html is committed and served,
        # so a run that lands the baseline has to rebuild it too. This is the
        # run that matters most -- it is the one that turns "12 flights a week"
        # into "12 against a baseline of 21" everywhere the report says it.
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python -m src.report

      - name: Checkpoint WAL
        run: |
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect("data/gulfwatch.db")
          c.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          c.close()
          PY

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gulfwatch.db public
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          # Same reason as the Backfill step: a scheduled run carries no inputs.
          window="${{ inputs.start }}..${{ inputs.end }}"
          if [ "$window" = ".." ]; then window="default window"; fi
          git commit -m "backfill: baseline $window"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  deploy:
    needs: backfill
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
